[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geographicol"
version = "0.1.0"
description = "Normalize Colombian addresses into a canonical, structured form. Zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "geographicol" }]
keywords = ["colombia", "address", "normalization", "direccion", "dane"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/geographicol/geographicol"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/geographicol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
